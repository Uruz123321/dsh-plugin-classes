name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Smoke tests (host + client)
        run: npm test
      - name: Publish manifest
        run: npm run check
      - name: Tarball contents
        run: npm pack --dry-run
